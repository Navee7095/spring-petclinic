trigger:
- main

variables:
  azureSubscription: 'AzureServiceConnection'   # MUST be Azure RM service connection
  webAppName: 'naveenjavaapp2026'
  environmentName: 'naveenjavaapp2026'

stages:

# ------------------- BUILD STAGE -------------------
- stage: Build
  displayName: "Build stage"
  jobs:
  - job: MavenBuild
    displayName: "Build with Maven"
    pool:
      name: Default   # change to 'naveen' if your agent pool is naveen

    steps:
    - task: Maven@4
      displayName: "Maven Package"
      inputs:
        mavenPomFile: 'pom.xml'
        mavenOptions: '-Xmx3072m'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.17'
        jdkArchitectureOption: 'x64'
        goals: 'clean package'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'

    - task: CopyFiles@2
      displayName: "Copy artifacts"
      inputs:
        SourceFolder: '$(System.DefaultWorkingDirectory)'
        Contents: '**/target/*.?(war|jar)'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: "Publish Artifacts"
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'drop'


# ------------------- DEPLOY STAGE -------------------
- stage: Deploy
  displayName: "Deploy stage"
  dependsOn: Build
  condition: succeeded()

  jobs:
  - deployment: DeployWebApp
    displayName: "Deploy to Azure Web App"
    environment: $(environmentName)

    pool:
      name: azure   # change if needed

    strategy:
      runOnce:
        deploy:
          steps:

          - download: current
            artifact: drop

          - task: AzureWebApp@1
            displayName: "Deploy to Azure Web App"
            inputs:
              azureSubscription: $(azureSubscription)
              appType: webAppLinux
              appName: $(webAppName)
              package: '$(Pipeline.Workspace)/drop/**/*.jar'
